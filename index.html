<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pelican on a Bicycle</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #cfe6f5;
      }
      #gpu {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      /* Only shown when WebGPU is missing or fails to start. */
      #hud {
        display: none;
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 4px 7px;
        font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gpu"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
